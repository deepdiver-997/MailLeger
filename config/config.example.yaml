# =====================================================================
# MailAgent 示例配置（可提交/公开）
# 本地真实配置 config/config.yaml（含个人账号）已被 .gitignore 忽略。
# 用法：cp config/config.example.yaml config/config.yaml，再把敏感项改成
#       ${ENV_VAR} 引用（配合 .env 文件：IMAP_PASSWORD / SMTP_PASSWORD / OPENAI_API_KEY）。
# =====================================================================

database_path: data/mailagent.db
log_file: logs/mailagent.log
log_level: INFO

# watch 模式的轮询间隔（秒）
scan_interval_seconds: 300

# 正文超过该字符数则不调用大模型，直接发送"请人工查看"模板通知
max_body_chars: 2000
# 提取正文时的硬上限字符数（防止超大邮件占用内存）
max_extract_chars: 20000
# 通知邮件中"判断原因"字段最大长度（字符）
reason_max_chars: 100
# outbox 单封邮件最大发送重试次数
max_send_retries: 50
# 每日汇总调用大模型生成摘要的输入上限（字符），超过则只输出分组列表
summary_llm_max_chars: 4000

# 大模型（OpenAI 兼容 API，如 DeepSeek / OpenAI）
llm:
  base_url: https://api.openai.com/v1
  api_key: ${OPENAI_API_KEY}
  model_name: gpt-4o-mini
  max_tokens: 100
  timeout_seconds: 30
  max_retries: 2
  # API 支持 JSON 模式时开启；不支持会自动降级为纯提示词约束
  json_mode: true
  # agent 生成类命令（#compose / #summarize）：输出远比分类长，单独配置模型与预算
  generate_model_name: ""          # 留空同 model_name；可指定更强的模型
  generate_max_tokens: 2000
  generate_timeout_seconds: 90

accounts:
  - name: main
    imap_host: imap.example.com
    imap_port: 993
    imap_use_ssl: true
    imap_user: you@example.com
    imap_password: ${IMAP_PASSWORD}

    smtp_host: smtp.example.com
    smtp_port: 465
    smtp_use_ssl: true        # false 时配合 smtp_starttls 使用 STARTTLS
    smtp_starttls: false
    smtp_user: you@example.com
    smtp_password: ${SMTP_PASSWORD}

    # 重要邮件通知收件箱
    notification_to: you@internal.example.com
    notification_from: mailagent@internal.example.com

    # 每日汇总时间（本地时间 HH:MM）
    daily_summary_time: "21:00"

    # 每账号每日大模型配额
    daily_max_calls: 500
    daily_max_tokens: 1000000

    # 处理完成后对服务器邮件的动作：mark_seen 或 move（移动到 processed_folder）
    on_processed: mark_seen
    processed_folder: Processed

  # ---------------------------------------------------------------------
  # 命令邮箱（role: agent）：只响应 allowed_senders 发来的 #命令 邮件，
  # 结果只会回给发出命令的人；非白名单来信静默丢弃、不回、不弹。
  # 前提：邮件服务端已拒绝"公网未认证会话携带本域发件人"，From 才可作为鉴权依据。
  # ---------------------------------------------------------------------
  - name: leger
    role: agent
    imap_host: imap.example.com
    imap_port: 993
    imap_use_ssl: true
    imap_user: leger@example.com
    imap_password: ${LEGER_IMAP_PASSWORD}

    smtp_host: smtp.example.com
    smtp_port: 465
    smtp_use_ssl: true
    smtp_starttls: false
    smtp_user: leger@example.com
    smtp_password: ${LEGER_SMTP_PASSWORD}

    # 白名单：允许下命令的地址（大小写不敏感）；不能包含本账号自己
    allowed_senders:
      - you@internal.example.com
    reply_display_name: Leger
    # 白名单来信但主题没写 #命令 时：help | compose
    default_command: help
    # 需要大模型的命令连续失败 N 次后回"处理失败"说明并终结，避免烧光配额
    max_command_attempts: 3
    # 生成/总结/改写的输出语言偏好（如 简体中文），留空则跟随指令与素材
    # reply_language: 简体中文
    # 可选：#compose/#rewrite 生成后支持"回复确认码即发送"。必须指向本配置中
    # 另一个账号（Leger 持有其 SMTP 凭据）；留空 = 永远只出草稿不发送
    # send_as: persona@example.com
    # 交给大模型的素材上限（字符）/ 单附件上限 / 生成邮件总体积上限（MB）
    max_material_chars: 12000
    max_attachment_mb: 10
    max_mime_mb: 25

    # agent 账号的模型配额同样生效
    daily_max_calls: 200
    daily_max_tokens: 500000

    on_processed: move
    processed_folder: Done
